name: CD Pipeline

on:
  push:
    branches: ["main", "cd-test"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make scripts executable
        run: chmod +x bash/*.sh

      - name: Fetch lib folder
        run: ./bash/fetch-lib.sh

      - name: Build project
        run: ./bash/fat-build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@1583c0f09d26c58c59d25b0eef29792b7ce99d9a

      - name: Log in to DockerHub
        uses: docker/login-action@28fdb31ff34708d19615a74d67103ddc2ea9725c
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@62929198b55fa8f3670ebe3db225f3c2679e183b
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/myapp:latest

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          release_name: Release v1.0.${{ github.run_number }}
          body: |
            Docker image: ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
          draft: false
          prerelease: false

      - name: Upload JAR to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./app.jar
          asset_name: app.jar
          asset_content_type: application/java-archive

      - name: Telegram notification
        uses: appleboy/telegram-action@1b2bf60368dcf9d8375bd26bee6c94649f670968
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "🚀 Релиз v1.0.${{ github.run_number }} опубликован!\nDocker: ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest"
