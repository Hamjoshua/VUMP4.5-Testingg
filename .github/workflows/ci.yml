name: CI Pipeline

on:
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Make scripts executable
        run: chmod +x bash/*.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch lib folder
        run: ./bash/fetch-lib.sh

      - name: Build project
        run: ./bash/build.sh
        
      - name: Run full app tests
        run: ./bash/launch.sh