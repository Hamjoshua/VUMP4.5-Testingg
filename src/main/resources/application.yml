spring:
datasource:
  url: jdbc:h2:file:./data/accesscontroldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  driver-class-name: org.h2.Driver
  username: sa
  password:

jpa:
  hibernate:
    ddl-auto: validate
  properties:
    hibernate:
      dialect: org.hibernate.dialect.H2Dialect
      format_sql: true
  show-sql: true

h2:
  console:
    enabled: true
    path: /h2-console

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true

logging:
  level:
    org.springframework: INFO
    org.example: DEBUG